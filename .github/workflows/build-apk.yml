name: Build Orynlo APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Prepare Android project
        shell: bash
        run: |
          if [ -f settings.gradle ]; then
            echo 'PROJECT_DIR=.' >> "$GITHUB_ENV"
          elif [ -f Orynlo_GitHub_APK.zip ]; then
            unzip -q Orynlo_GitHub_APK.zip -d .orynlo-build
            test -f .orynlo-build/settings.gradle
            echo 'PROJECT_DIR=.orynlo-build' >> "$GITHUB_ENV"
          else
            echo 'Upload Orynlo_GitHub_APK.zip to the repository root without renaming it.'
            exit 1
          fi

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android tools
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'

      - name: Check source
        working-directory: ${{ env.PROJECT_DIR }}
        run: bash tests/run.sh

      - name: Build and lint APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Name APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: cp app/build/outputs/apk/debug/app-debug.apk Orynlo-Voice-Desk.apk

      - name: Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Orynlo-APK
          path: ${{ env.PROJECT_DIR }}/Orynlo-Voice-Desk.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports/
          if-no-files-found: ignore
